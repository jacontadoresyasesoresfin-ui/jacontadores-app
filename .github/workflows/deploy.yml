name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_COMPANY_WHATSAPP: ${{ secrets.NEXT_PUBLIC_COMPANY_WHATSAPP }}
          NEXT_PUBLIC_COMPANY_EMAIL: ${{ secrets.NEXT_PUBLIC_COMPANY_EMAIL }}
          NEXT_PUBLIC_COMPANY_PHONE: ${{ secrets.NEXT_PUBLIC_COMPANY_PHONE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ML_APP_ID: ${{ secrets.ML_APP_ID }}
          ML_SECRET_KEY: ${{ secrets.ML_SECRET_KEY }}
          ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}

      - name: Prepare standalone for FTP sync
        run: |
          # Mover archivos estaticos y publicos dentro del standalone
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          echo "Contenido a desplegar:"
          ls -la .next/standalone/

      - name: Deploy via FTP to app.jacontadores.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          local-dir: .next/standalone/
          server-dir: /app.jacontadores.com/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/.cache/**

      - name: Restart app via cPanel API
        run: |
          echo "Reiniciando la aplicacion Node.js..."
          curl -ks \
            -u "${{ secrets.SSH_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.SSH_HOST }}:2083/execute/Fileman/save_file_content" \
            -d "dir=/home/${{ secrets.SSH_USERNAME }}/app.jacontadores.com/tmp" \
            -d "file=restart.txt" \
            -d "content=restarted"
          echo "Deploy completado: $(date)"
