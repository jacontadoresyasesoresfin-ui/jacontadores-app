name: Build and Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_NAME: ${{ secrets.NEXT_PUBLIC_APP_NAME }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_COMPANY_WHATSAPP: ${{ secrets.NEXT_PUBLIC_COMPANY_WHATSAPP }}
          NEXT_PUBLIC_COMPANY_EMAIL: ${{ secrets.NEXT_PUBLIC_COMPANY_EMAIL }}
          NEXT_PUBLIC_COMPANY_PHONE: ${{ secrets.NEXT_PUBLIC_COMPANY_PHONE }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ML_APP_ID: ${{ secrets.ML_APP_ID }}
          ML_SECRET_KEY: ${{ secrets.ML_SECRET_KEY }}
          ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}

      - name: Prepare deployment package
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../..
          echo "Package size: $(du -sh deploy.zip | cut -f1)"

      - name: Upload package via cPanel API
        run: |
          echo "Subiendo deploy.zip al servidor..."
          RESPONSE=$(curl -ks \
            -u "${{ secrets.SSH_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.SSH_HOST }}:2083/execute/Fileman/upload_files" \
            -F "dir=/home/${{ secrets.SSH_USERNAME }}/app.jacontadores.com" \
            -F "file=@deploy.zip" \
            -w "\nHTTP_CODE:%{http_code}")
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_CODE:")
          echo "Respuesta HTTP: $HTTP_CODE"
          echo "Cuerpo: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Fallo la subida (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Extract package via cPanel API
        run: |
          echo "Extrayendo archivos en el servidor..."
          curl -ks \
            -u "${{ secrets.SSH_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.SSH_HOST }}:2083/execute/Fileman/extract_archive" \
            -d "dir=/home/${{ secrets.SSH_USERNAME }}/app.jacontadores.com" \
            -d "file=deploy.zip" \
            -d "type=zip"
          echo "Extraccion completada"

      - name: Restart app via cPanel API
        run: |
          echo "Reiniciando la aplicacion Node.js..."
          curl -ks \
            -u "${{ secrets.SSH_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.SSH_HOST }}:2083/execute/Fileman/save_file_content" \
            -d "dir=/home/${{ secrets.SSH_USERNAME }}/app.jacontadores.com/tmp" \
            -d "file=restart.txt" \
            -d "content=restart"
          echo "Deploy completado: $(date)"
